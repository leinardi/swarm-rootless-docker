# commit-msg as well as pre-commit, so that `make pre-commit-install` installs
# the conventional-commit check too: the release version is derived from the
# commit types, so a message that cannot be classified is caught at commit time
# rather than at release time.
default_install_hook_types: [pre-commit, commit-msg]
# Serena (.serena/) writes and rewrites its own config and memories: not ours to lint.
exclude: ^\.serena/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      # The fixtures are captured bytes: never rewritten.
      - id: end-of-file-fixer
        exclude: ^testdata/
      - id: trailing-whitespace
        exclude: ^testdata/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-shellcheck", "shellcheck -S error"]
      - id: actionlint
        alias: actionlint-oneline
        name: actionlint (one line per one error)
        files: ^\.github/workflows/.*\.(yml|yaml)$
        args: ["-oneline", "-shellcheck", "shellcheck -S error"]
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        additional_dependencies:
          - markdownlint-rule-table-format@1.0.3
  # Pinned rather than taken from the system, so a developer machine and CI run the same release.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
      - id: shellcheck
        alias: shellcheck-diff-output
        name: shellcheck (diff output)
        args: ["-f", "diff", "-x"]
        stages: [manual]
      - id: shellcheck
        alias: shellcheck-json-output
        name: shellcheck (json output)
        args: ["-f", "json", "-x"]
        stages: [manual]
  - repo: local
    hooks:
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        files: \.(yml|yaml)$
        args: ["--write"]
      # Every source file carries the MIT header (scripts/check-license-headers.sh says which files
      # are governed). Reads the whole tree, so it always runs; pinned to one stage because
      # always_run makes a hook eligible at every installed stage, and commit-msg is one of them.
      - id: check-license-headers
        name: license headers
        entry: scripts/check-license-headers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  # The Rust workspace. Every command is workspace-wide, so the meta crate is held to the same
  # lints as the launcher, and --locked, so Cargo.lock is what gets tested. The toolchain comes
  # from rust-toolchain.toml.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: '(\.rs$|^rustfmt\.toml$|^rust-toolchain\.toml$)'
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^clippy\.toml$|^rust-toolchain\.toml$)'
      # The rust job's documentation check (make rust-doc), run before the commit rather than found
      # in CI: the docs of every crate and feature, warnings as errors, as the make target (a broken
      # or private intra-doc link fails it). Incremental, so a warm run takes seconds.
      - id: cargo-doc
        name: cargo doc
        entry: env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --all-features --no-deps --locked
        language: system
        pass_filenames: false
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)'
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --locked
        language: system
        pass_filenames: false
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)'
      # Dependency-change check, and nothing more: it fires when the dependency graph changes,
      # needs the network for the advisory database, and catches a bad upgrade at the moment it is
      # made. It does not catch an advisory published later against a crate nobody touched since;
      # the rust CI job and the scheduled scan run the same check on every pull request and weekly.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false
        require_serial: true
        files: '((^|/)Cargo\.(toml|lock)$|^deny\.toml$)'
  # Unused dependencies in every workspace member's Cargo.toml. Upstream triggers it on manifest
  # changes only; deleting the last `use` of a crate in a .rs file is what usually makes a
  # dependency unused, so Rust sources trigger it too.
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        types_or: [rust, cargo, cargo-lock]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
      - id: yamllint
        alias: yamllint-parsable
        name: "yamllint (parsable output)"
        args: ["--format", "parsable"]
        stages: [manual]
  - repo: https://github.com/docker-compose-linter/pre-commit-dclint
    rev: v3.1.0
    hooks:
      - id: dclint
        language_version: 22.15.0
        files: ^(?:.*/)?(?:docker-)?compose(?:\.[\w-]+)?\.ya?ml$
        args: [--fix]
  # Every relative link and fragment in the Markdown resolves, offline: an external URL is not
  # fetched. A whole-tree check, so it always runs (deleting a linked page passes no file to the
  # hook at all) and takes its inputs from args rather than from the file list. --hidden reaches
  # .github, .agents and .claude, which the glob skips otherwise; .gitignore still applies. The
  # hook installs the pinned release with cargo-binstall on its first run.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        name: lychee
        args: ["--offline", "--include-fragments", "--no-progress", "--hidden", "**/*.md"]
        types: [markdown]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  # Dockerfile Roast, built from source at this rev (language: rust), so every machine runs the
  # same release. Policy in droast.toml; its ShellCheck bridge is required and runs the
  # `shellcheck` on PATH, which CI pins with .github/actions/setup-shellcheck.
  - repo: https://github.com/immanuwell/dockerfile-roast
    rev: 1.7.0
    hooks:
      - id: droast
  # The release version is derived from the commit types since the last tag, so
  # a message nobody can classify is a release nobody can version. With
  # --force-scope: every commit from now on names a scope, and CONTRIBUTING.md
  # requires one.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--force-scope"]
