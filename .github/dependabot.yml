version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # The runtime base is the floating docker:<major>-dind-rootless tag, so the
  # only update Dependabot can propose is the next Docker major (a tag-only
  # FROM keeps its suffix and its precision: never 29.10-dind-rootless). That
  # is a feature: the floating image tag moves to <major>-uid<UID>, which the
  # homelab switches to deliberately; merge it by hand. Base fixes within a
  # major arrive as new upstream digests, which the scheduled release
  # rebuilds; no PR is involved.
  - package-ecosystem: "docker"
    directory: "/deployments/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "feat(deps)"
    labels: ["dependencies", "docker"]
    ignore:
      # The build stage's Rust is one line with rust-toolchain.toml, and its
      # patch release is the one the RUST_VERSION argument and the musl
      # standard libraries' sha256s are written for: a tag bump alone would
      # break the build. Bump the image, RUST_VERSION and the checksums
      # together, by hand. dhi.io also needs a login Dependabot does not have.
      - dependency-name: "dhi.io/rust"
      - dependency-name: "rust"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # fix, not chore: the release version is derived from commit types, so a
    # crate bump (security fixes included) produces a patch release of the
    # image. Dev-dependencies never reach the binary, so their bumps are
    # chore(deps) and in a group of their own: one grouped PR carries a single
    # prefix. The meta crate's dependencies count as production ones here (it
    # is a workspace member), so a bump of only those releases an unchanged
    # binary: harmless, a patch with the same launcher.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      cargo-crates:
        dependency-type: "production"
        patterns:
          - "*"
      cargo-dev-crates:
        dependency-type: "development"
        patterns:
          - "*"
