name: Scheduled scan

# A release is scanned once, when it is built. Vulnerabilities are published every day, so the
# images people pull and the dependencies on main are scanned again every week, with the release's
# own scanner and gate. A failure fails the run, which is what makes it visible: fix it with a new
# release.
on:
  schedule:
    # Mondays, 06:17 UTC: off the hour, when scheduled runs pile up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same values as release.yaml, changed together with it.
  RELEASE_TAG_REGEX: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  IMAGE_REPO: ghcr.io/leinardi/swarm-rootless-docker
  IMAGE_VARIANTS: "568:568"
  PLATFORMS: linux/amd64
  TRIVY_VERSION: v0.74.0

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # the images, should the package not be public

    steps:
      # release-plan.sh and the tags, to find what each floating tag points at; scan-findings.sh
      # and .trivyignore.yaml, the release's gate and exceptions.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # The floating <docker-major>-uid<UID> tags point at the highest release of each Docker
      # major. Each is scanned by the version tag of that release, resolved once to its index
      # digest, so a tag that moves during the run cannot mix two releases into one result, and
      # against the base digest the image records.
      - name: Scan the images behind the floating tags
        run: |
          set -euo pipefail
          TAGS=$(git tag --list | { grep -E "$RELEASE_TAG_REGEX" || [ $? -eq 1 ]; })
          if [ -z "$TAGS" ]; then
            echo "::notice::Nothing is released yet."
            exit 0
          fi
          FAILED=false
          for tag in $TAGS; do
            if [ "$(.github/scripts/release-plan.sh floating "$tag")" != "true" ]; then
              continue
            fi
            for variant in $IMAGE_VARIANTS; do
              ref="$IMAGE_REPO:$tag-uid${variant%%:*}"
              DIGEST=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')
              BASE=$(docker buildx imagetools inspect "$IMAGE_REPO@$DIGEST" --format '{{json .Image}}' \
                | jq -r '(if has("config") then . else .[] end) | .config.Labels["org.opencontainers.image.base.digest"]' \
                | sort -u)
              echo "Scanning $ref ($DIGEST), built on $BASE"
              if ! .github/scripts/scan-findings.sh "$IMAGE_REPO@$DIGEST" "docker.io/library/docker@$BASE"; then
                FAILED=true
              fi
            done
          done
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny over main's dependencies, as ci.yaml's rust job runs it.
      - name: Check the Rust dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
