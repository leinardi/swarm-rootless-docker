name: CI

# The authoritative checks run on every pull request and every push to main; the reviewdog jobs only
# annotate pull requests. ci-result is the one check the branch ruleset requires.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# Every job reads the repository and nothing else, unless it says otherwise below.
permissions:
  contents: read

jobs:
  # The authoritative lint gate: every pre-commit hook over every file. The hooks bring their own
  # tools (pre-commit installs them); actionlint also runs the runner's preinstalled shellcheck over
  # the workflows' run: scripts. The Rust hooks run the toolchain installed here. Two hooks are
  # skipped because the rust job below runs the same thing: cargo-test and cargo-deny.
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For the cargo-fmt, cargo-clippy and cargo-machete hooks, and the docs-links hook (a meta-test).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # droast's ShellCheck bridge runs the shellcheck on PATH: the pinned one, not the runner's.
      - name: Set up ShellCheck
        uses: ./.github/actions/setup-shellcheck

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook on every file
        env:
          SKIP: cargo-test,cargo-deny
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier, dclint fix); this also fails on a file a hook creates, which its
      # diff check does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Reports inline PR review comments over a diff range; a push or a manual dispatch has neither a
  # pull request to comment on nor a base ref to diff against. Annotation only: pre-commit-all is
  # the gate, so none of these jobs is needed by ci-result.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # droast's ShellCheck bridge runs the shellcheck on PATH: the pinned one, not the runner's.
      - name: Set up ShellCheck
        uses: ./.github/actions/setup-shellcheck

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files
            dclint
            droast

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # Every commit in the pull request must follow Conventional Commits with a
    # scope: the release version is derived from commit types, and every commit
    # lands on main as it is. The local commit-msg hook only runs where
    # `make pre-commit-install` was run; this job is the check no commit skips.
    # It runs the repository's own conventional-pre-commit hook and skips merge
    # commits. No pull-request title check: squash merging is disabled.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The release workflow's scripts, against scratch repositories and stub gh, docker, svu and trivy
  # commands: release.yaml runs them, and a mistake there would only show in a release.
  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release-plan.sh
        run: bash .github/scripts/release-plan.test.sh

      - name: Test scan-findings.sh
        run: bash .github/scripts/scan-findings.test.sh

  # The Rust workspace: the same workspace-wide commands as make verify-rust and the pre-commit
  # hooks, plus cargo-deny (advisories, licences, bans and sources; the advisory database needs the
  # network). The toolchain matches rust-toolchain.toml. The tests include the meta crate's; with
  # SWARM_ROOTLESS_DOCKER_REQUIRE_TOOLS=1 a tool they drive that is missing fails them instead of
  # skipping them.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The meta crate's Dockerfile test drives droast, whose ShellCheck bridge is required.
      - name: Set up droast
        uses: ./.github/actions/setup-droast

      # droast's ShellCheck bridge runs the shellcheck on PATH: the pinned one, not the runner's.
      - name: Set up ShellCheck
        uses: ./.github/actions/setup-shellcheck

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the tests
        env:
          SWARM_ROOTLESS_DOCKER_REQUIRE_TOOLS: "1"
        run: cargo test --workspace --locked

      - name: Check Rust documentation
        run: make rust-doc

      - name: Check dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The image, as the 568 variant: built, checked without a daemon, then run against the runner's
  # Docker by the integration tests. The build stage pulls dhi.io/rust, which needs the login. A
  # pull request from a fork (or from Dependabot) gets no secrets: it builds the binary here and
  # hands it to the Dockerfile in place of its build stage, so no credential ever meets
  # untrusted code and the check still passes. Ubuntu runners restrict unprivileged user
  # namespaces through AppArmor, which rootlesskit needs: the job lifts the restriction on its
  # own throwaway runner.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_DHI_TOKEN: ${{ secrets.DHI_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hardened Images (dhi.io)
        if: env.HAS_DHI_TOKEN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-musl

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lift the AppArmor user-namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the image
        if: env.HAS_DHI_TOKEN == 'true'
        run: make image-build

      - name: Build the image without dhi.io (no secrets)
        if: env.HAS_DHI_TOKEN != 'true'
        run: make image-build-prebuilt

      - name: Check the image
        run: make image-test

      # The Swarm test deploys into the node's swarm: this throwaway runner gets its own.
      - name: Initialise a single-node swarm
        run: docker swarm init > /dev/null

      # SRD_IT_REQUIRE=1: a test that did not run fails instead of passing. SRD_IT_SWARM=1 turns
      # on the Swarm test, which is off on a developer's machine.
      - name: Run the integration tests
        env:
          SRD_IT_REQUIRE: "1"
          SRD_IT_SWARM: "1"
        run: make integration-test

  # The single required check: green only when every gating job succeeded. conventional-commits
  # only runs on pull requests, so it may be skipped on a push or a dispatch.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - conventional-commits
      - release-scripts
      - rust
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
