name: Release swarm-rootless-docker

# One run plans, requires CI green on the commit it releases, audits that commit's dependencies,
# builds the launcher binary once and every image variant from it, tests and scans each, tags the
# commit, publishes the images and the GitHub release, and moves the floating tags. Adapted from
# leinardi/herdquay's release workflow: the same order and recovery rules, one image per UID:GID
# variant, a daily schedule, and a base image resolved and pinned per build.
#
# What runs and on which commit is decided by .github/scripts/release-plan.sh (its header lists
# the modes): a new version from HEAD; a rebuild of the latest release's own commit as a patch,
# when upstream's docker:<major>-dind-rootless has a new digest; the finishing of a release that
# failed part-way; or nothing. Whatever the mode, ci-result must be green on the planned commit
# (the ci-green job), and the release-time test and lint suites are not run again: CI ran them on
# that commit, the image's full suite included, on the same packaging path (docs/release.md,
# "What CI proves"). The release runs the whole image suite itself only in base mode, and for a
# base digest no earlier release was built on: the base floats by tag, so CI may have tested an
# older rebuild of it, and a base rebuild ships a digest CI never saw.
#
# The order is deliberate: everything that can fail does so before the tag exists, because tags in
# this repository are immutable and a failure cannot be cleaned up after the tag. Each image is
# built once, into a job-local registry, and tested and scanned there; only that digest is copied
# to GHCR, after the tag. Everything after the tag push reuses what is already published only once
# it is proven to be this workflow's, and never replaces it, so the next run finishes a failed
# publish.
#
# Tags, per variant: vX.Y.Z-uid<UID> (immutable) and <docker-major>-uid<UID> (floating; it moves
# only to the highest release of its Docker major). No latest: the floating tag names the Docker
# major a consumer runs.
on:
  workflow_dispatch:
    inputs:
      # Left empty, the version comes from the Conventional Commits since the last tag. An explicit
      # one is checked for shape and for being higher than every released version; an explicit one
      # that is already tagged finishes that release. The first release needs one: there is no tag
      # to derive it from.
      version:
        description: "Version, e.g. 0.1.0 or v0.1.0 (empty: derive from the commits)"
        required: false
      # Plans, builds, tests and scans the images, rehearses the copy, and stops there: no tag is
      # pushed and nothing is published.
      dry_run:
        description: "Dry run: build, test and scan, stop before the tag is pushed"
        type: boolean
        default: false
  schedule:
    # Daily, 04:41 UTC: off the hour, when scheduled runs pile up. A base rebuild ships upstream's
    # fixes within a day of upstream publishing them.
    - cron: "41 4 * * *"

# One release at a time, and never cancelled. Two runs in flight together would each check "higher
# than every released version" against the same tags, and a run that has started is never killed
# part-way through publishing. A second run waits for the first instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The one definition of a release tag: vMAJOR.MINOR.PATCH, strict SemVer core with no leading
  # zeros, no pre-release and no build metadata. Every lookup filters the tag list through this
  # with grep -E, never through a glob.
  RELEASE_TAG_REGEX: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  IMAGE_REPO: ghcr.io/leinardi/swarm-rootless-docker
  # The variants, as UID:GID pairs, space-separated: one image each, all at one version. The UID
  # names the tags. ci.yaml's image job tests the same list (meta/tests/release.rs), and every
  # variant has a scan step of its own below.
  IMAGE_VARIANTS: "568:568"
  # The variant the integration tests are written for; the others get the image checks only.
  INTEGRATION_VARIANT: "568:568"
  # The workflow every published artifact must come from. The guard job makes every run of this
  # file a run on refs/heads/main, so the keyless cosign identity a sign in this run produces is
  # exactly SIGNER_IDENTITY, and a signature or an attestation from any other workflow or branch
  # does not count.
  SIGNER_WORKFLOW: leinardi/swarm-rootless-docker/.github/workflows/release.yaml
  SIGNER_IDENTITY: https://github.com/leinardi/swarm-rootless-docker/.github/workflows/release.yaml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  # castor is amd64: one platform for now, arm64 later.
  PLATFORMS: linux/amd64
  # The job-local registries the images are built into, and a dry run copies to. Pinned by index
  # digest, like every image this workflow runs.
  REGISTRY_IMAGE: registry:3.1.2@sha256:c87f33837722a100572e95d7dc4bf539fc42cf68202b13c3bc03c0ff54c3a649
  LOCAL_IMAGE: localhost:5000/swarm-rootless-docker
  COPY_IMAGE: localhost:5001/swarm-rootless-docker
  # Copies a scanned index to GHCR with its digest.
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5

jobs:
  # workflow_dispatch lets the caller pick any branch, and the release jobs hold contents: write,
  # packages: write and an OIDC identity. Dispatched from a side branch they would tag and publish
  # that branch's tree. This fails rather than skips, so such a run is red and not a green no-op,
  # and every other job waits on it. A schedule always runs on the default branch. The second line
  # of defence is the `release` environment, whose deployment branch rule allows main only.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refuse to release anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "A release runs from main only (got $REF). Nothing was tagged or published." >&2
            exit 1
          fi

  # Read-only: decides the mode, the commit, the version and the base, and pins the base's digest
  # once for the whole run.
  plan:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # the published images' base digest labels
      actions: read # require-ci-green reads ci.yaml's runs on HEAD
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      major: ${{ steps.plan.outputs.major }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      base_from: ${{ steps.plan.outputs.base_from }}
      base_repo: ${{ steps.plan.outputs.base_repo }}
      base_digest: ${{ steps.plan.outputs.base_digest }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
      scan_baseline: ${{ steps.plan.outputs.scan_baseline }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # svu reads the tags and the commits since the last one; a base rebuild reads an older
          # commit's Dockerfile.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Only to derive a version: a version typed by hand releases even while GitHub's release
      # downloads fail. A schedule always derives (svu next says whether HEAD has anything to
      # release).
      - name: Install svu
        if: inputs.version == ''
        uses: leinardi/gh-composite-actions/setup-svu@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      # A schedule releases HEAD only when CI has already passed on it, and otherwise considers a
      # base rebuild of the latest release: this reads that once, without waiting. It is not the
      # gate: the ci-green job requires CI green on whatever commit the plan picks, and a failure
      # here, a red, pending or missing run or an API error alike, only means "not green" to the
      # plan. A dispatch skips it: it releases HEAD or nothing, and ci-green waits for CI on it.
      - name: Read CI on HEAD (schedule)
        id: head-ci
        if: github.event_name == 'schedule'
        continue-on-error: true # a schedule only asks whether HEAD is green yet; ci-green is the gate
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          accepted-events: push
          # A schedule's event payload has no repository, so its default branch is named here.
          default-branch: main
          timeout: "0"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan the release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          HEAD_CI: ${{ steps.head-ci.outcome == 'success' && 'green' || 'not-green' }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release-plan.sh plan

      - name: Summarize the plan
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          SHA: ${{ steps.plan.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          BASE_REF: ${{ steps.plan.outputs.base_ref }}
          BASE_DIGEST: ${{ steps.plan.outputs.base_digest }}
          FULL_SUITE: ${{ steps.plan.outputs.full_suite }}
          SCAN_BASELINE: ${{ steps.plan.outputs.scan_baseline }}
        run: |
          set -euo pipefail
          {
            echo "# Release plan: $MODE"
            echo
            if [ "$MODE" = "none" ]; then
              echo "Nothing to release."
            else
              echo "$VERSION from \`$SHA\` on \`$BASE_REF@$BASE_DIGEST\` (previous: ${PREVIOUS:-none})."
              echo
              if [ "$FULL_SUITE" = "true" ]; then
                echo "The release runs the whole image suite: base mode, or a base digest no earlier release was built on."
              else
                echo "The release smoke-tests the images: the previous release was built on the same base digest."
              fi
              echo
              if [ -n "$SCAN_BASELINE" ]; then
                echo "The Trivy gate fails only on what the images add to \`$SCAN_BASELINE\` (a base rebuild, or its recovery)."
              else
                echo "The Trivy gate counts every finding, the base's included."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The release-time test, lint and integration suites are replaced by this gate: CI (ci.yaml) must
  # have passed on the planned commit, on its push to main. Its ci-result needs the rust job (fmt,
  # clippy, the tests, the docs, cargo-deny), the release-scripts job and the image job, which
  # builds every variant from the release's make target and runs the full image suite and the
  # integration tests on it. A dispatch right after a merge finds CI still running on the merge
  # commit: this waits for it, up to 30 minutes. For a base rebuild or a recovery the commit is an
  # older one, whose push to main passed CI when it was released.
  ci-green:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read

    steps:
      - name: Require CI green on the commit to release
        uses: leinardi/gh-composite-actions/require-ci-green@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          sha: ${{ needs.plan.outputs.sha }}
          accepted-events: push
          # A schedule's event payload has no repository, so its default branch is named here.
          default-branch: main

  # The time-sensitive check: advisories are published every day, so the dependency graph of the
  # commit being released is checked again now (advisories, licences, bans and sources), with that
  # commit's deny.toml. It needs only the plan, which names the commit, so it runs alongside
  # ci-green and the release job's build rather than before them; the release job waits for it to
  # pass right before its first step that publishes anything, the tag push. Nothing needs it.
  # Pinning cargo-deny does not pin what it knows: the advisory database is fetched at run time.
  audit:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # cargo-deny reads the graph through cargo metadata, with the commit's pinned toolchain.
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Set up cargo-deny
        uses: leinardi/gh-composite-actions/setup-cargo-deny@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      - name: Check the Rust dependencies with cargo-deny
        run: make rust-deny

  # Builds, tests and scans every variant that needs building, then pushes the tag and copies the
  # tested digests to GHCR, untagged. The commit built is the plan's, which for a base rebuild or a
  # recovery is older than the workflow's own: its Dockerfile, Makefile, tests and Trivy exceptions
  # are the ones used, so an old commit is tested the way it was released.
  release:
    needs:
      - guard
      - plan
      - ci-green
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Its deployment branch rule allows main only (the account's IaC), and it has no reviewers: the
    # daily schedule releases with no human in the loop. The later jobs only run after this one.
    environment: release
    permissions:
      contents: write # push the tag
      packages: write # copy the images to GHCR
      attestations: read # verify a published image before reusing it
      actions: read # require-job-success reads the audit job of this run
    outputs:
      tag_exists: ${{ steps.tag.outputs.exists }}
      variants: ${{ steps.publishable.outputs.variants }}
      toolchains: ${{ steps.toolchains.outputs.lines }}
      base_line: ${{ steps.images.outputs.base_line }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      BASE_REF: ${{ needs.plan.outputs.base_ref }}
      BASE_FROM: ${{ needs.plan.outputs.base_from }}
      BASE_DIGEST: ${{ needs.plan.outputs.base_digest }}
      FULL_SUITE: ${{ needs.plan.outputs.full_suite }}
      SCAN_BASELINE: ${{ needs.plan.outputs.scan_baseline }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      # What dtolnay/rust-toolchain exported to every later step of the job.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      # No persisted credentials: the one step that writes to the repository, the tag push, passes
      # the token to that one git command.
      - name: Checkout the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Everything stamped into the images comes from the commit, never from the clock or the
      # clone. The release's own script comes from the workflow's commit, not from the one built,
      # which may predate it: it writes the tag's record, which a later recovery reads with the same
      # script.
      - name: Check the commit and its base
        id: commit
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/scripts/release-plan.sh" > "$RUNNER_TEMP/release-plan.sh"
          chmod +x "$RUNNER_TEMP/release-plan.sh"
          # Per variant, tab-separated: UID, GID, build or reuse, index digest, platform digest.
          echo "VARIANTS_FILE=$RUNNER_TEMP/variants.tsv" >> "$GITHUB_ENV"
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "The checkout is $(git rev-parse HEAD), not the planned $SHA." >&2
            exit 1
          fi
          # The build context below replaces the runtime stage's FROM by name, as the commit writes
          # it (docker.io/library/docker:<major>-dind-rootless, or docker:<major>-dind-rootless in
          # v0.3.0 and earlier): a name that matched no FROM would leave the floating tag in place,
          # unpinned.
          if ! grep -qxF "FROM $BASE_FROM AS runtime" deployments/docker/Dockerfile; then
            echo "deployments/docker/Dockerfile at $SHA has no 'FROM $BASE_FROM AS runtime'." >&2
            exit 1
          fi
          FRONTEND=$(sed -nE '1s/^#[[:space:]]*syntax=[^[:space:]]+@(sha256:[0-9a-f]{64}).*/\1/p' deployments/docker/Dockerfile)
          if [ -z "$FRONTEND" ]; then
            echo "deployments/docker/Dockerfile at $SHA does not pin the frontend: '# syntax=<image>@sha256:<digest>'." >&2
            exit 1
          fi
          {
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
            echo "frontend=$FRONTEND"
          } >> "$GITHUB_OUTPUT"

      # Every external image pinned and every download verified, as CI checks it: the runtime base
      # by its floating docker:<major>-dind-rootless tag (pinned per build below, by the digest the
      # plan resolved) and the dhi.io build stage by an explicit tag, both deliberately tag-only;
      # anything else, the frontend included, by digest. The matcher compares the repository as
      # the Dockerfile writes it, so the exemption is exactly the commit's own runtime base:
      # docker.io/library/docker, or docker for v0.3.0 and earlier (base_repo, which the plan only
      # takes in those two spellings).
      - name: Check the Dockerfile pins
        uses: leinardi/gh-composite-actions/check-pinned-bases@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          dockerfiles: deployments/docker/Dockerfile
          tag-only-images: |
            dhi.io
            ${{ needs.plan.outputs.base_repo }}

      # A tag that already exists is a recovery: it must point at this commit, and the run
      # continues without pushing it again. A tag that appeared since the plan, or one that points
      # elsewhere, stops the run: nothing here may overwrite one.
      - name: Check the tag
        id: tag
        run: |
          set -euo pipefail
          PEELED=$(git ls-remote origin "refs/tags/$VERSION^{}" | awk '{print $1}')
          REMOTE=$(git ls-remote origin "refs/tags/$VERSION" | awk '{print $1}')
          POINTS_AT="${PEELED:-$REMOTE}"

          if [ -n "$POINTS_AT" ]; then
            if [ "$POINTS_AT" != "$SHA" ]; then
              echo "$VERSION already exists and points at $POINTS_AT, not at $SHA. Tags here are immutable: release a new version instead." >&2
              exit 1
            fi
            if [ "$MODE" != "recover" ]; then
              echo "$VERSION was tagged after the plan was made. Nothing was pushed; the next run finishes it." >&2
              exit 1
            fi
            echo "$VERSION already exists on this commit: finishing its publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MODE" = "recover" ]; then
            echo "$VERSION is not tagged on the remote, but the plan was to finish it." >&2
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per variant, from the Git tag (the step above) and the image :<version>-uid<UID> on GHCR.
      # Only "not found" counts as absent: an authentication or network error stops the run.
      #
      #   Git tag         variant image                                    action
      #   absent          absent                                           build
      #   absent          present                                          stop before tagging
      #   on this commit  absent                                           build
      #   on this commit  present, attested by this workflow, this commit  reuse
      #   on this commit  present, anything else                           stop: needs a human
      #
      # A dry run rehearses a fresh release whatever the state: it builds every variant, and stops
      # at the absence check if an image exists.
      - name: Decide what to build
        id: decide
        env:
          TAG_EXISTS: ${{ steps.tag.outputs.exists }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$VARIANTS_FILE"
          BUILD=false
          for variant in $IMAGE_VARIANTS; do
            uid="${variant%%:*}"
            gid="${variant#*:}"
            ref="$IMAGE_REPO:$VERSION-uid$uid"
            if OUT=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>&1); then
              digest=$(jq -r '.digest' <<<"$OUT")
            elif grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
              digest=""
            else
              echo "Could not tell whether $ref exists: $OUT" >&2
              exit 1
            fi

            if [ -z "$digest" ] || [ "$DRY_RUN" = "true" ]; then
              action=build
              BUILD=true
            elif [ "$TAG_EXISTS" != "true" ]; then
              echo "$ref already exists ($digest), but the tag $VERSION does not. The version is held by an image, so it cannot be tagged: nothing was pushed. Release a higher version." >&2
              exit 1
            else
              # Verified by digest, not by tag, so what is checked is what is reused.
              if ! gh attestation verify "oci://$IMAGE_REPO@$digest" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$SIGNER_WORKFLOW" \
                --source-ref refs/heads/main > /dev/null; then
                echo "$ref ($digest) carries no provenance from $SIGNER_WORKFLOW. A tag this workflow did not produce is holding the version. Nothing was published: it needs a human." >&2
                exit 1
              fi
              # The commit and the base it records must be this release's: the plan takes a
              # recovery's base from its published images, so a variant built now matches them.
              BUILT=$(docker buildx imagetools inspect "$IMAGE_REPO@$digest" --format '{{json .Image}}' \
                | jq -r '(if has("config") then . else .[] end) | .config.Labels
                    | "\(.["org.opencontainers.image.revision"]) \(.["org.opencontainers.image.base.digest"])"' \
                | sort -u)
              if [ "$BUILT" != "$SHA $BASE_DIGEST" ]; then
                echo "$ref ($digest) is built from and on '$BUILT', not '$SHA $BASE_DIGEST'. Nothing was published: it needs a human." >&2
                exit 1
              fi
              action=reuse
            fi
            echo "$ref: ${digest:-absent}, $action"
            printf '%s\t%s\t%s\t%s\t%s\n' "$uid" "$gid" "$action" "$digest" "" >> "$VARIANTS_FILE"
          done
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # For the launcher binary below, and for the integration tests, which the commit's own Makefile
      # runs with cargo. rust-toolchain.toml names the release, the components and the musl target.
      - name: Set up Rust
        if: steps.decide.outputs.build == 'true'
        run: rustup toolchain install --no-self-update

      # A recovery builds a missing variant with the toolchain the tag records, and fails closed
      # when it cannot switch to it. Tags from before the toolchain was recorded (v0.3.0 and
      # earlier) record none and pass with a warning: every variant is an image of its own, with no
      # release asset whose bytes a rebuilt binary would have to match. A new tag has nothing to
      # recover, and this is a no-op.
      - name: Recover the recorded toolchain
        if: steps.decide.outputs.build == 'true'
        uses: leinardi/gh-composite-actions/toolchain-recover@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          toolchains: rust
          rust-targets: x86_64-unknown-linux-musl
          tag: ${{ steps.tag.outputs.exists == 'true' && needs.plan.outputs.version || '' }}
          allow-unrecorded: "true"

      # The musl target the launcher is built for, on whichever toolchain is now active (the
      # commit's rust-toolchain.toml, or the one recovered above), in every mode: a commit's
      # toolchain file may not list it (v0.3.0 and earlier do not), and a recovery that switched
      # toolchains installed it only for a toolchain it recorded.
      - name: Add the musl target
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl

      # The toolchain this run builds with, as the new tag's annotation records it.
      - name: Record the toolchain
        id: toolchains
        if: steps.decide.outputs.build == 'true'
        uses: leinardi/gh-composite-actions/toolchain-record@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          toolchains: rust

      # The annotated tag, in the clone only, until the point of no return below, recording the
      # toolchain, the base digest and the scan policy (release-plan.sh record: the base digest the
      # Trivy gate compared with, or none). A recovery of the tag reads them back, so it builds on
      # the same base and scans the same way even if the run fails right after the tag push. A
      # recovery's tag is already here.
      - name: Create the tag locally
        if: steps.tag.outputs.exists != 'true'
        env:
          TOOLCHAINS: ${{ steps.toolchains.outputs.lines }}
        run: |
          set -euo pipefail
          RECORD=$("$RUNNER_TEMP/release-plan.sh" record "$BASE_REF" "$BASE_DIGEST" "$SCAN_BASELINE")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'swarm-rootless-docker %s\n\n%s\n%s\n' "$VERSION" "$TOOLCHAINS" "$RECORD" > "$RUNNER_TEMP/tag-message.txt"
          git tag -a "$VERSION" -F "$RUNNER_TEMP/tag-message.txt"

      # The release's own cache, under its own prefix: written only by this workflow, which runs on
      # main only, and never CI's. It speeds the build, and changes nothing in what it produces.
      - name: Cache the Rust build
        if: steps.decide.outputs.build == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release

      # The launcher, built once for every variant with CI's make target (image-binary): a static
      # musl binary stamped with this release's version, commit and commit date. A commit from
      # before that target (v0.3.0 and earlier, rebuilt on a new base) builds the same binary into
      # the same place with the cargo command its image-build-prebuilt ran.
      - name: Build the launcher binary
        id: binary
        if: steps.decide.outputs.build == 'true'
        env:
          BUILD_DATE: ${{ steps.commit.outputs.build_date }}
        run: |
          set -euo pipefail
          stamps=(GIT_VERSION="$VERSION" GIT_COMMIT="$SHA" BUILD_DATE="$BUILD_DATE")
          if make -n image-binary "${stamps[@]}" > /dev/null 2>&1; then
            make image-binary "${stamps[@]}" < /dev/null
          else
            echo "::notice::$SHA's Makefile has no image-binary target: building the binary as its image-build-prebuilt does."
            SWARM_ROOTLESS_DOCKER_VERSION="$VERSION" SWARM_ROOTLESS_DOCKER_COMMIT="$SHA" SWARM_ROOTLESS_DOCKER_DATE="$BUILD_DATE" \
              cargo build --release --locked --target x86_64-unknown-linux-musl --bin swarm-rootless-docker < /dev/null
            mkdir -p target/image-context/out
            cp target/x86_64-unknown-linux-musl/release/swarm-rootless-docker target/image-context/out/swarm-rootless-docker
          fi
          BINARY=target/image-context/out/swarm-rootless-docker
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum < "$BINARY" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "$BINARY: $(sha256sum < "$BINARY" | cut -d' ' -f1)"

      # Host network, so the builder reaches the job-local registry on localhost.
      - name: Set up Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Start the job-local registries
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker run -d --name local-registry -p 5000:5000 "$REGISTRY_IMAGE"
          PORTS=(5000)
          if [ "$DRY_RUN" = "true" ]; then
            docker run -d --name copy-registry -p 5001:5000 "$REGISTRY_IMAGE"
            PORTS+=(5001)
          fi
          for port in "${PORTS[@]}"; do
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:$port/v2/"; then
                continue 2
              fi
              sleep 1
            done
            echo "The job-local registry on port $port did not come up." >&2
            exit 1
          done

      # The only image builds, one per variant, as CI builds them (make image-build-prebuilt): the
      # named context `build` replaces the Dockerfile's build stage with the binary above, so dhi.io
      # is never contacted, and a second one replaces the runtime stage's FROM with exactly the base
      # digest the plan resolved. Pushed by digest with no tag, with the SBOM and mode=max
      # provenance in the index. Every layer is recompressed as gzip: for a zstd layer skopeo
      # rewrites the index entries with a compression annotation, which --preserve-digests then
      # refuses, so the copy below could not keep the tested digest. No build cache: the image is
      # the base, the user rewrite and one COPY.
      - name: Build the images into the job-local registry
        if: steps.decide.outputs.build == 'true'
        env:
          BUILD_DATE: ${{ steps.commit.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          NEXT="$VARIANTS_FILE.next"
          : > "$NEXT"
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" = "build" ]; then
              META="$RUNNER_TEMP/build-$uid.json"
              docker buildx build < /dev/null \
                --file deployments/docker/Dockerfile \
                --platform "$PLATFORMS" \
                --build-context "build=target/image-context" \
                --build-context "$BASE_FROM=docker-image://$BASE_REF@$BASE_DIGEST" \
                --build-arg "VERSION=$VERSION" \
                --build-arg "COMMIT=$SHA" \
                --build-arg "DATE=$BUILD_DATE" \
                --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
                --build-arg "ROOTLESS_UID=$uid" \
                --build-arg "ROOTLESS_GID=$gid" \
                --build-arg "BASE_DIGEST=$BASE_DIGEST" \
                --provenance mode=max \
                --sbom true \
                --output "type=image,name=$LOCAL_IMAGE,push-by-digest=true,name-canonical=true,push=true,compression=gzip,force-compression=true" \
                --metadata-file "$META" \
                .
              digest=$(jq -r '."containerimage.digest"' "$META")
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "The build of uid $uid reported no index digest: $(cat "$META")" >&2
                exit 1
              fi
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$uid" "$gid" "$action" "$digest" "$platform" >> "$NEXT"
          done 3< "$VARIANTS_FILE"
          mv "$NEXT" "$VARIANTS_FILE"

      # The platform image of each index, by its own digest: what is tested and scanned below is
      # exactly what is copied to GHCR. It must carry this release's labels, and its layers must
      # start with the pinned base's own: the proof that the build context replaced the FROM. The
      # provenance must name exactly what the build pulled: the pinned base at the plan's digest and
      # the pinned frontend, nothing else (BuildKit's SBOM scanner, docker/buildkit-syft-scanner,
      # generates the SBOM and is not part of the image), so no dhi.io/rust either: the base digest
      # the release notes record is read from it, not assumed.
      - name: Check the built images
        id: images
        if: steps.decide.outputs.build == 'true'
        env:
          FRONTEND: ${{ steps.commit.outputs.frontend }}
        run: |
          set -euo pipefail
          BASE=$(docker buildx imagetools inspect "${BASE_REF%:*}@$BASE_DIGEST" --format '{{json .Image}}' \
            | jq -c --arg platform "$PLATFORMS" 'if has("rootfs") then . else .[$platform] end | .rootfs.diff_ids')
          if [ "$(jq 'length' <<<"$BASE")" -eq 0 ]; then
            echo "The base $BASE_DIGEST has no $PLATFORMS layers." >&2
            exit 1
          fi
          # BuildKit names Docker Hub's official images without docker.io/library/ in a purl.
          BASE_NAME="${BASE_REF%:*}"
          BASE_PURL="pkg:docker/${BASE_NAME#docker.io/library/}@${BASE_REF##*:}?"
          RESOLVED=""
          NEXT="$VARIANTS_FILE.next"
          : > "$NEXT"
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" = "build" ]; then
              INDEX=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$digest" --format '{{json .Manifest}}')
              platform=$(jq -r --arg os "${PLATFORMS%%/*}" --arg arch "${PLATFORMS#*/}" \
                '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
                <<<"$INDEX")
              if [ -z "$platform" ]; then
                echo "The index $digest of uid $uid has no single $PLATFORMS image." >&2
                exit 1
              fi
              CONFIG=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$platform" --format '{{json .Image}}')
              PROBLEMS=$(jq -r \
                --arg version "$VERSION" --arg sha "$SHA" --arg base_digest "$BASE_DIGEST" \
                --arg base_name "$BASE_REF" --arg uid "$uid" --arg gid "$gid" \
                --argjson base "$BASE" '
                  .config.Labels as $labels
                  | ( [
                        ["org.opencontainers.image.version", $version],
                        ["org.opencontainers.image.revision", $sha],
                        ["org.opencontainers.image.base.digest", $base_digest],
                        ["org.opencontainers.image.base.name", $base_name],
                        ["io.github.leinardi.swarm-rootless-docker.uid", $uid],
                        ["io.github.leinardi.swarm-rootless-docker.gid", $gid]
                      ][]
                      | select($labels[.[0]] != .[1])
                      | "label \(.[0]) is \($labels[.[0]]), want \(.[1])" ),
                    ( if .rootfs.diff_ids[0:($base | length)] == $base then empty
                      else "the layers do not start with the base \($base_digest)" end )
                ' <<<"$CONFIG")
              if [ -n "$PROBLEMS" ]; then
                echo "The image of uid $uid ($platform):" >&2
                echo "$PROBLEMS" >&2
                exit 1
              fi
              # One platform: the provenance itself; several: a map of them by platform.
              USED=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$digest" --format '{{json .Provenance}}' \
                | jq -r --arg platform "$PLATFORMS" '
                    (if has("SLSA") then .SLSA else .[$platform].SLSA end)
                    | (.materials // .buildDefinition.resolvedDependencies // [])[]
                    | select(.uri | startswith("pkg:docker/"))
                    | select(.uri | startswith("pkg:docker/docker/buildkit-syft-scanner@") | not)
                    | "\(.uri) sha256:\(.digest.sha256)"
                  ' | sort -u)
              BASE_DIGESTS=$(awk -v purl="$BASE_PURL" 'index($1, purl) == 1 {print $2}' <<<"$USED" | sort -u)
              FRONTENDS=$(awk 'index($1, "pkg:docker/docker/dockerfile@") == 1 {print $2}' <<<"$USED" | sort -u)
              OTHERS=$(awk -v purl="$BASE_PURL" 'index($1, purl) != 1 && index($1, "pkg:docker/docker/dockerfile@") != 1' <<<"$USED")
              if [ "$BASE_DIGESTS" != "$BASE_DIGEST" ] || [ "$FRONTENDS" != "$FRONTEND" ] || [ -n "$OTHERS" ]; then
                echo "The build of uid $uid did not pull exactly $BASE_REF@$BASE_DIGEST and the pinned frontend $FRONTEND." >&2
                echo "Pulled (provenance):" >&2
                echo "${USED:-nothing}" >&2
                exit 1
              fi
              RESOLVED="$BASE_REF@$BASE_DIGESTS"
              echo "uid $uid: index $digest, $PLATFORMS image $platform, on $RESOLVED (provenance)"
              echo "uid$uid=$platform" >> "$GITHUB_OUTPUT"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$uid" "$gid" "$action" "$digest" "$platform" >> "$NEXT"
          done 3< "$VARIANTS_FILE"
          mv "$NEXT" "$VARIANTS_FILE"
          echo "base_line=$PLATFORMS \`$RESOLVED\`" >> "$GITHUB_OUTPUT"

      # The short smoke test of every built image, pulled back from the job-local registry by its
      # platform digest rather than built again: its launcher is the binary built above, byte for
      # byte, and it says which release it is (the labels above are the build arguments read back;
      # this runs the binary, so a version module that stops reading its stamps fails here, before
      # any tag exists). The image is amd64 only, so no emulation is needed.
      - name: Smoke-test the built images
        if: steps.decide.outputs.build == 'true'
        env:
          BUILD_DATE: ${{ steps.commit.outputs.build_date }}
          BINARY_SHA256: ${{ steps.binary.outputs.sha256 }}
        run: |
          set -euo pipefail
          WANT="swarm-rootless-docker $VERSION ($SHA, $BUILD_DATE)"
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" != "build" ]; then
              continue
            fi
            docker pull "$LOCAL_IMAGE@$platform" > /dev/null
            IN_IMAGE=$(docker run --rm --network none --user 0:0 --entrypoint sha256sum "$LOCAL_IMAGE@$platform" \
              /usr/local/bin/swarm-rootless-docker < /dev/null | cut -d' ' -f1)
            GOT=$(docker run --rm --network none "$LOCAL_IMAGE@$platform" --version < /dev/null)
            docker image rm "$LOCAL_IMAGE@$platform" > /dev/null
            if [ "$IN_IMAGE" != "$BINARY_SHA256" ]; then
              echo "uid $uid's launcher is $IN_IMAGE, not the binary built above ($BINARY_SHA256). Nothing was tagged or published." >&2
              exit 1
            fi
            if [ "$GOT" != "$WANT" ]; then
              echo "uid $uid prints '$GOT', want '$WANT'. Nothing was tagged or published." >&2
              exit 1
            fi
            echo "uid $uid: $GOT, launcher $IN_IMAGE"
          done 3< "$VARIANTS_FILE"

      # The whole image suite, only when the plan asks for it (full_suite): in base mode, which
      # ships a base digest CI never saw, and for any release whose base digest no earlier release
      # was built on. Otherwise CI's run of it on this commit stands (the ci-green job), on the same
      # packaging path and base tag. Ubuntu runners restrict unprivileged user namespaces through
      # AppArmor, which rootlesskit needs; the Swarm test deploys into this throwaway runner's own
      # swarm. As in ci.yaml.
      - name: Prepare the runner for the integration tests
        if: steps.decide.outputs.build == 'true' && env.FULL_SUITE == 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker swarm init > /dev/null

      # ci.yaml's image checks and integration tests, with the commit's own Makefile and scripts,
      # against each built platform digest pulled back from the job-local registry rather than a
      # second build.
      - name: Test the built images (full suite)
        if: steps.decide.outputs.build == 'true' && env.FULL_SUITE == 'true'
        env:
          SRD_IT_REQUIRE: "1"
          SRD_IT_SWARM: "1"
        run: |
          set -euo pipefail
          case " $IMAGE_VARIANTS " in
            *" $INTEGRATION_VARIANT "*) ;;
            *)
              echo "INTEGRATION_VARIANT $INTEGRATION_VARIANT is not one of IMAGE_VARIANTS ($IMAGE_VARIANTS)." >&2
              exit 1
              ;;
          esac
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" != "build" ]; then
              continue
            fi
            IMAGE="swarm-rootless-docker:release-uid$uid"
            docker pull "$LOCAL_IMAGE@$platform"
            docker tag "$LOCAL_IMAGE@$platform" "$IMAGE"
            make image-test IMAGE="$IMAGE" ROOTLESS_UID="$uid" ROOTLESS_GID="$gid" < /dev/null
            if [ "$uid:$gid" = "$INTEGRATION_VARIANT" ]; then
              make integration-test IMAGE="$IMAGE" < /dev/null
            fi
            docker image rm "$IMAGE" "$LOCAL_IMAGE@$platform" > /dev/null
          done 3< "$VARIANTS_FILE"

      # A HIGH or CRITICAL finding with a fix upstream fails the run here, before any tag exists.
      # Unfixed findings do not, and the only exceptions are the commit's .trivyignore.yaml, each
      # with a statement and an expiry. Trivy is its latest release, never pinned. In base mode
      # alone, and in the recovery of a base rebuild, which restores the policy from its tag
      # (scan_baseline), the gate is the image's findings against its base digest
      # (baseline-image): it fails on what the image adds, and reports upstream's own as warnings,
      # because a base rebuild exists to ship upstream's fixes and an inherited finding the new
      # digest still carries would otherwise block the very release that brings the others. Every
      # other release gates on every finding, the base's included. One step per variant
      # (meta/tests/release.rs checks there is one for each); a variant reused from GHCR is
      # scanned by the publish job.
      - name: Scan the uid 568 image
        if: steps.images.outputs.uid568 != ''
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.LOCAL_IMAGE }}@${{ steps.images.outputs.uid568 }}
          platform: ${{ env.PLATFORMS }}
          baseline-image: ${{ needs.plan.outputs.scan_baseline }}

      # The last look at the tags before the point of no return. Concurrency serializes the
      # workflow, but a tag can also arrive from outside it, and the plan ran before the builds.
      # This asks the remote, now.
      - name: Gate the tag
        if: steps.tag.outputs.exists != 'true' || env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under set -e instead of
          # reading as "no tags"; only grep finding no release tag may come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || [ $? -eq 1 ]; } \
            | sort -V \
            | tail -n1)
          if [ -z "$HIGHEST_REMOTE" ] || [ "$HIGHEST_REMOTE" = "$VERSION" ]; then
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$HIGHEST_REMOTE" | sort -V | tail -n1)
          if [ "$HIGHEST" = "$VERSION" ]; then
            exit 0
          fi
          if [ "$MODE" = "recover" ]; then
            echo "::notice::$HIGHEST_REMOTE is higher than $VERSION. Finishing the release of $VERSION, which will not take the floating tags."
            exit 0
          fi
          echo "$HIGHEST_REMOTE was published while this run was building, so $VERSION would be a lower immutable tag. Nothing was pushed." >&2
          exit 1

      # Right before the tag is pushed: no variant's version may be held by an image, or the tag
      # would point at a version this run can never publish. Same fail-closed lookup as above.
      - name: Check the version images are absent
        if: steps.tag.outputs.exists != 'true' || env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          for variant in $IMAGE_VARIANTS; do
            ref="$IMAGE_REPO:$VERSION-uid${variant%%:*}"
            if OUT=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "$ref exists. Nothing was pushed; release a higher version." >&2
              exit 1
            elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
              echo "Could not tell whether $ref exists: $OUT" >&2
              exit 1
            fi
          done

      # The copy below, against the second job-local registry instead of GHCR, with the same
      # checks: the digest survives, and so do the SBOM and provenance manifests.
      - name: Rehearse the copy on a second local registry
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          WANT=$(tr ',' '\n' <<<"$PLATFORMS" | wc -l)
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            docker run --rm --network host "$SKOPEO_IMAGE" copy --all --preserve-digests \
              --src-tls-verify=false --dest-tls-verify=false \
              "docker://$LOCAL_IMAGE@$digest" "docker://$COPY_IMAGE@$digest" < /dev/null
            RAW=$(mktemp)
            docker run --rm --network host "$SKOPEO_IMAGE" inspect --raw --tls-verify=false \
              "docker://$COPY_IMAGE@$digest" > "$RAW" < /dev/null
            COPIED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
            if [ "$COPIED" != "$digest" ]; then
              echo "The copied index of uid $uid is $COPIED, not the tested $digest." >&2
              exit 1
            fi
            ATTESTATIONS=$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' "$RAW")
            if [ "$ATTESTATIONS" -ne "$WANT" ]; then
              echo "The copied index of uid $uid carries $ATTESTATIONS attestation manifests, want $WANT (one per platform)." >&2
              exit 1
            fi
            echo "uid $uid: copied $digest with its digest and $ATTESTATIONS attestation manifests intact."
          done 3< "$VARIANTS_FILE"

      # The audit runs alongside this job rather than before it, so the build does not wait for
      # the advisories; nothing is published until it has passed in this run attempt (an earlier
      # attempt's pass never counts, so a re-run uses "Re-run all jobs" - docs/release.md). A dry
      # run waits for it too, so it reports the audit a real run would face.
      - name: Require the audit to have passed
        uses: leinardi/gh-composite-actions/require-job-success@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          job: audit

      - name: Report what a real run would publish
        if: env.DRY_RUN == 'true'
        env:
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          BASE_LINE: ${{ steps.images.outputs.base_line }}
          TOOLCHAINS: ${{ steps.toolchains.outputs.lines }}
        run: |
          set -euo pipefail
          {
            echo "# Dry run: $VERSION ($MODE)"
            echo
            echo "From \`$SHA\` on \`$BASE_REF@$BASE_DIGEST\`; previous release: ${PREVIOUS:-none}. Full image suite: $FULL_SUITE."
            echo
            echo "No tag was created and nothing was published. The launcher was built with $TOOLCHAINS, each image index"
            echo "was built from it into a job-local registry, its $PLATFORMS image was smoke-tested and scanned, and the"
            echo "index was copied to a second local registry with its digest and attestation manifests intact:"
            echo
            while IFS=$'\t' read -r uid gid action digest platform; do
              echo "- uid $uid, gid $gid: \`$digest\` (\`$platform\`)"
            done < "$VARIANTS_FILE"
            echo
            echo "The base each platform was built on (provenance): $BASE_LINE"
          } >> "$GITHUB_STEP_SUMMARY"

      # The point of no return. Everything after it reuses a published artifact only once it is
      # proven to be this workflow's and never replaces one, so the next run finishes a failed
      # publish. The token reaches this one git command as a header, never the clone's config.
      - name: Push the tag
        if: env.DRY_RUN != 'true' && steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "refs/tags/$VERSION"

      # The tested indexes, byte for byte, with no tag at all: a version tag is only ever added
      # once the digest has been attested and signed, so an untagged digest left by a failed run is
      # inert. What GHCR then serves under each digest is hashed here, not taken from a tool's
      # report.
      - name: Copy the images to GHCR by digest
        if: env.DRY_RUN != 'true' && steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" != "build" ]; then
              continue
            fi
            docker run --rm --network host -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
              copy --all --preserve-digests --src-tls-verify=false --dest-authfile /auth.json \
              "docker://$LOCAL_IMAGE@$digest" "docker://$IMAGE_REPO@$digest" < /dev/null
            RAW=$(mktemp)
            docker run --rm -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
              inspect --raw --authfile /auth.json "docker://$IMAGE_REPO@$digest" > "$RAW" < /dev/null
            SERVED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
            if [ "$SERVED" != "$digest" ]; then
              echo "GHCR serves $SERVED for $IMAGE_REPO@$digest (uid $uid), not the tested index. Nothing was tagged." >&2
              exit 1
            fi
          done 3< "$VARIANTS_FILE"

      # The variants for the publish job's matrix.
      - name: List the variants to publish
        id: publishable
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          VARIANTS=$(jq -R -s -c '
            split("\n") | map(select(length > 0) | split("\t")
            | {uid: .[0], gid: .[1], action: .[2], digest: .[3]})
          ' "$VARIANTS_FILE")
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"

  # Per variant: attest and sign a new digest, or check a reused one carries this workflow's
  # signature, then add its version tag.
  publish:
    needs:
      - plan
      - release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # It holds packages: write and an OIDC identity, so it is deployed to the release environment
    # too, with its main-only branch rule.
    environment: release
    permissions:
      contents: read
      packages: write # attestation, signature and version tag
      id-token: write # cosign keyless signing and provenance via GitHub OIDC
      attestations: write # provenance attestation upload
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.release.outputs.variants) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UID_TAG: uid${{ matrix.variant.uid }}
      ACTION: ${{ matrix.variant.action }}
      DIGEST: ${{ matrix.variant.digest }}

    steps:
      # The workflow's own commit, for the current Trivy exceptions.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign v3 stores the signature as a Sigstore bundle in an OCI 1.1 referring artifact;
      # a consumer needs cosign v3, or v2.6+ with --new-bundle-format, to verify.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest image provenance
        if: matrix.variant.action == 'build'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ matrix.variant.digest }}
          push-to-registry: true

      # A new digest is signed. A reused one must already carry this workflow's own keyless
      # signature, since the version tag is only ever added after signing; any other signature,
      # from another workflow or a laptop, does not count.
      - name: Sign the image with cosign (keyless via GitHub OIDC)
        run: |
          set -euo pipefail
          if [ "$ACTION" = "reuse" ]; then
            if ! cosign verify \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$IMAGE_REPO@$DIGEST" > /dev/null; then
              echo "$IMAGE_REPO@$DIGEST is attested by this workflow but carries no signature from it. Nothing more was published: it needs a human." >&2
              exit 1
            fi
            echo "$IMAGE_REPO@$DIGEST carries this workflow's signature: reusing it."
          else
            cosign sign --yes "$IMAGE_REPO@$DIGEST"
          fi

      # The reused image is already published and immutable, so its scan cannot stop anything:
      # findings are reported as a warning by the step after, for a human to judge whether to
      # release sooner. It is scanned as the release job scans what it builds.
      - name: Scan the reused image
        id: reuse-scan
        if: matrix.variant.action == 'reuse'
        continue-on-error: true # findings in an image already published are warnings
        uses: leinardi/gh-composite-actions/trivy-gate@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2
        with:
          image: ${{ env.IMAGE_REPO }}@${{ matrix.variant.digest }}
          platform: ${{ env.PLATFORMS }}
          # The release's scan policy, as the tag records it.
          baseline-image: ${{ needs.plan.outputs.scan_baseline }}

      - name: Warn about the reused image's findings
        if: matrix.variant.action == 'reuse' && steps.reuse-scan.outcome != 'success'
        env:
          OUTCOME: ${{ steps.reuse-scan.outcome }}
        run: |
          echo "::warning::The reused $IMAGE_REPO@$DIGEST has fixable HIGH or CRITICAL findings, or could not be scanned ($OUTCOME). It is already published and was not changed; consider releasing a new version."

      # The reused image is already tagged, so this stops nothing from being pushed; it makes a
      # rerun that reuses an image say whether the binary carries this release's version and
      # commit. The build date is not known here, so it is not compared.
      - name: Smoke-test the reused image's version stamps
        if: matrix.variant.action == 'reuse'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          GOT=$(docker run --rm --network none "$IMAGE_REPO@$DIGEST" --version < /dev/null)
          case "$GOT" in
            "swarm-rootless-docker $VERSION ($SHA, "*")") echo "$GOT" ;;
            *)
              echo "The reused $IMAGE_REPO@$DIGEST prints '$GOT', want version $VERSION and commit $SHA. It needs a human." >&2
              exit 1
              ;;
          esac

      - name: Tag the image with the version
        if: matrix.variant.action == 'build'
        run: |
          set -euo pipefail
          ref="$IMAGE_REPO:$VERSION-$UID_TAG"
          # Checked again right before tagging: a version tag that appeared since the checks above
          # is never overwritten.
          if OUT=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "$ref appeared while this run was publishing. It was not overwritten: the next run verifies it, or it needs a human." >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
            echo "Could not tell whether $ref exists: $OUT" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$ref" "$IMAGE_REPO@$DIGEST"

  # The GitHub release and the floating tags, once every variant carries its version tag.
  finalize:
    needs:
      - plan
      - release
      - publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # It holds contents: write and packages: write: deployed to the release environment too.
    environment: release
    permissions:
      contents: write # create and publish the release
      packages: write # move the floating tags
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      MAJOR: ${{ needs.plan.outputs.major }}
      BASE_REF: ${{ needs.plan.outputs.base_ref }}
      BASE_DIGEST: ${{ needs.plan.outputs.base_digest }}
      SCAN_BASELINE: ${{ needs.plan.outputs.scan_baseline }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # The workflow's own commit, for release-plan.sh, with every tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digests the release job tested (or verified, for a reused image) and the publish job
      # attested and signed are the ones the floating tags move to. Each version tag must still
      # resolve to its digest: one that changed since was not published by this run, and nothing is
      # promoted from it.
      - name: Check the published images
        id: images
        env:
          VARIANTS: ${{ needs.release.outputs.variants }}
        run: |
          set -euo pipefail
          DIGESTS=""
          while read -r uid digest; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "The release job reported no digest for uid $uid (got '$digest')." >&2
              exit 1
            fi
            ref="$IMAGE_REPO:$VERSION-uid$uid"
            TAGGED=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ "$TAGGED" != "$digest" ]; then
              echo "$ref resolves to $TAGGED, not to the published $digest. Nothing was promoted: it needs a human." >&2
              exit 1
            fi
            DIGESTS+="$uid=$digest "
          done < <(jq -r '.[] | "\(.uid) \(.digest)"' <<<"$VARIANTS")
          WANT=$(wc -w <<<"$IMAGE_VARIANTS")
          if [ "$(wc -w <<<"$DIGESTS")" -ne "$WANT" ]; then
            echo "The release job reported '$DIGESTS', want one digest for each of the $WANT variants." >&2
            exit 1
          fi
          echo "digests=$DIGESTS" >> "$GITHUB_OUTPUT"

      # The release carries no assets: the images are the artifact. It is created as a draft if it
      # does not exist yet, and stays one until the floating tags have moved. An asset on it means
      # something outside this workflow touched it: that needs a human.
      - name: Draft the GitHub release
        env:
          DIGESTS: ${{ steps.images.outputs.digests }}
          BASE_LINE: ${{ needs.release.outputs.base_line }}
          TOOLCHAINS: ${{ needs.release.outputs.toolchains }}
        run: |
          set -euo pipefail
          if ! OUT=$(gh release view "$VERSION" --json isDraft 2>&1); then
            if ! grep -qi 'release not found' <<<"$OUT"; then
              echo "Could not tell whether the release $VERSION exists: $OUT" >&2
              exit 1
            fi
            NOTES=$(mktemp)
            {
              # A base rebuild, or the recovery of one (its tag records the scan baseline).
              if [ "$MODE" = "base" ] || [ -n "$SCAN_BASELINE" ]; then
                echo "A rebuild of $PREVIOUS's commit on a new digest of its base: no code change."
                echo
              fi
              # The base digest is the plan's pin, which the release job checked against the
              # build's provenance; a recovery that reused every image built nothing to read.
              echo "Built on \`$BASE_REF@$BASE_DIGEST\`${BASE_LINE:+ (provenance: $BASE_LINE)}${TOOLCHAINS:+, the launcher with $TOOLCHAINS}."
              echo "The base floats by its Docker major tag: CI tested this commit on that tag as it stood then, which may be an older rebuild of it."
              echo
              echo "Images:"
              echo
              for entry in $DIGESTS; do
                echo "- \`$IMAGE_REPO:$VERSION-uid${entry%%=*}\` (\`${entry#*=}\`)"
              done
            } > "$NOTES"
            gh release create "$VERSION" --verify-tag --draft --generate-notes --notes-file "$NOTES" --title "$VERSION"
          fi
          # Read into a variable first, so a failed lookup stops the step instead of reading as
          # "no assets".
          NAMES=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          if [ -n "$NAMES" ]; then
            echo "The release $VERSION carries assets this workflow never uploads: $NAMES. Nothing was changed; it needs a human." >&2
            exit 1
          fi

      # The floating <docker-major>-uid<UID> tags go last, after a fresh look at the remote tags: a
      # version that is no longer the highest of its Docker major does not take them. Best-effort,
      # not atomic: a release of the same major tagged outside this workflow in between can leave
      # them behind, and re-running that release's own run repoints them.
      - name: Move the floating tags
        id: floating
        env:
          DIGESTS: ${{ steps.images.outputs.digests }}
        run: |
          set -euo pipefail
          git fetch --quiet origin 'refs/tags/*:refs/tags/*'
          FLOATING=$(.github/scripts/release-plan.sh floating "$VERSION")
          if [ "$FLOATING" != "true" ]; then
            echo "::notice::A higher release of Docker $MAJOR exists, so the $MAJOR-uid<UID> tags were left where they are."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for entry in $DIGESTS; do
            docker buildx imagetools create -t "$IMAGE_REPO:$MAJOR-uid${entry%%=*}" "$IMAGE_REPO@${entry#*=}"
          done
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        id: publish
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under set -e instead of
          # reading as "no tags"; only grep finding no release tag may come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || [ $? -eq 1 ]; } \
            | sort -V \
            | tail -n1)
          LATEST=false
          if [ "$HIGHEST_REMOTE" = "$VERSION" ]; then
            LATEST=true
          fi
          gh release edit "$VERSION" --draft=false --latest="$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Summarize the release
        env:
          DIGESTS: ${{ steps.images.outputs.digests }}
          MOVED: ${{ steps.floating.outputs.moved }}
          LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          set -euo pipefail
          {
            echo "# Released $VERSION ($MODE)"
            echo
            echo "From \`$SHA\` on \`$BASE_REF@$BASE_DIGEST\`; previous release: ${PREVIOUS:-none}."
            echo
            echo "- [Release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION) - marked latest: $LATEST"
            for entry in $DIGESTS; do
              echo "- \`$IMAGE_REPO:$VERSION-uid${entry%%=*}\` (\`${entry#*=}\`) - \`$MAJOR-uid${entry%%=*}\` moved: $MOVED"
            done
          } >> "$GITHUB_STEP_SUMMARY"
