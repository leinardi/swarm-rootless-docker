name: Release swarm-rootless-docker

# One run plans, builds, tests and scans the image variants, tags the commit, publishes the images
# and the GitHub release, and moves the floating tags. Adapted from leinardi/herdquay's release
# workflow: the same order and recovery rules, one image per UID:GID variant, a daily schedule,
# and a base image resolved and pinned per build.
#
# What runs and on which commit is decided by .github/scripts/release-plan.sh (its header lists
# the modes): a new version from HEAD, only with ci-result green on that exact commit; a rebuild of
# the latest release's own commit as a patch, when upstream's docker:<major>-dind-rootless has a
# new digest; the finishing of a release that failed part-way; or nothing.
#
# The order is deliberate: everything that can fail does so before the tag exists, because tags in
# this repository are immutable and a failure cannot be cleaned up after the tag. Each image is
# built once, into a job-local registry, and tested and scanned there; only that digest is copied
# to GHCR, after the tag. Everything after the tag push reuses what is already published only once
# it is proven to be this workflow's, and never replaces it, so the next run finishes a failed
# publish.
#
# Tags, per variant: vX.Y.Z-uid<UID> (immutable) and <docker-major>-uid<UID> (floating; it moves
# only to the highest release of its Docker major). No latest: the floating tag names the Docker
# major a consumer runs.
on:
  workflow_dispatch:
    inputs:
      # Left empty, the version comes from the Conventional Commits since the last tag. An explicit
      # one is checked for shape and for being higher than every released version; an explicit one
      # that is already tagged finishes that release. The first release needs one: there is no tag
      # to derive it from.
      version:
        description: "Version, e.g. 0.1.0 or v0.1.0 (empty: derive from the commits)"
        required: false
      # Plans, builds, tests and scans the images, rehearses the copy, and stops there: no tag is
      # pushed and nothing is published.
      dry_run:
        description: "Dry run: build, test and scan, stop before the tag is pushed"
        type: boolean
        default: false
  schedule:
    # Daily, 04:41 UTC: off the hour, when scheduled runs pile up. A base rebuild ships upstream's
    # fixes within a day of upstream publishing them.
    - cron: "41 4 * * *"

# One release at a time, and never cancelled. Two runs in flight together would each check "higher
# than every released version" against the same tags, and a run that has started is never killed
# part-way through publishing. A second run waits for the first instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned by hand: dependabot does not track a `go install` argument.
  SVU_VERSION: v3.4.1
  # Builds svu only.
  GO_VERSION: 1.26.10
  # The one definition of a release tag: vMAJOR.MINOR.PATCH, strict SemVer core with no leading
  # zeros, no pre-release and no build metadata. Every lookup filters the tag list through this
  # with grep -E, never through a glob.
  RELEASE_TAG_REGEX: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  IMAGE_REPO: ghcr.io/leinardi/swarm-rootless-docker
  # The variants, as UID:GID pairs, space-separated: one image each, all at one version. The UID
  # names the tags.
  IMAGE_VARIANTS: "568:568"
  # The variant the integration tests are written for; the others get the image checks only.
  INTEGRATION_VARIANT: "568:568"
  # The workflow every published artifact must come from. The guard job makes every run of this
  # file a run on refs/heads/main, so the keyless cosign identity a sign in this run produces is
  # exactly SIGNER_IDENTITY, and a signature or an attestation from any other workflow or branch
  # does not count.
  SIGNER_WORKFLOW: leinardi/swarm-rootless-docker/.github/workflows/release.yaml
  SIGNER_IDENTITY: https://github.com/leinardi/swarm-rootless-docker/.github/workflows/release.yaml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  # castor is amd64: one platform for now, arm64 later.
  PLATFORMS: linux/amd64
  # The job-local registries the images are built into, and a dry run copies to. Pinned by index
  # digest, like every image this workflow runs.
  REGISTRY_IMAGE: registry:3.1.2@sha256:c87f33837722a100572e95d7dc4bf539fc42cf68202b13c3bc03c0ff54c3a649
  LOCAL_IMAGE: localhost:5000/swarm-rootless-docker
  COPY_IMAGE: localhost:5001/swarm-rootless-docker
  # Copies a scanned index to GHCR with its digest.
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.3-immutable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5
  # Pinned by hand, like SVU_VERSION. scheduled-scan.yaml scans with the same version; bump both
  # together.
  TRIVY_VERSION: v0.74.0

jobs:
  # workflow_dispatch lets the caller pick any branch, and the release jobs hold contents: write,
  # packages: write and an OIDC identity. Dispatched from a side branch they would tag and publish
  # that branch's tree. This fails rather than skips, so such a run is red and not a green no-op,
  # and every other job waits on it. A schedule always runs on the default branch.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refuse to release anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "A release runs from main only (got $REF). Nothing was tagged or published." >&2
            exit 1
          fi

  # Read-only: decides the mode, the commit, the version and the base, and pins the base's digest
  # once for the whole run.
  plan:
    needs: guard
    runs-on: ubuntu-latest
    # A dispatch waits up to 30 minutes for CI to finish on the commit it releases.
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read # ci-result of the commit to release
      packages: read # the published images' base digest labels
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      major: ${{ steps.plan.outputs.major }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      base_digest: ${{ steps.plan.outputs.base_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # svu reads the tags and the commits since the last one; a base rebuild reads an older
          # commit's Dockerfile.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install svu
        run: go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan the release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release-plan.sh plan

      - name: Summarize the plan
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          SHA: ${{ steps.plan.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          BASE_REF: ${{ steps.plan.outputs.base_ref }}
          BASE_DIGEST: ${{ steps.plan.outputs.base_digest }}
        run: |
          set -euo pipefail
          {
            echo "# Release plan: $MODE"
            echo
            if [ "$MODE" = "none" ]; then
              echo "Nothing to release."
            else
              echo "$VERSION from \`$SHA\` on \`$BASE_REF@$BASE_DIGEST\` (previous: ${PREVIOUS:-none})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds, tests and scans every variant that needs building, then pushes the tag and copies the
  # tested digests to GHCR, untagged. The commit built is the plan's, which for a base rebuild or a
  # recovery is older than the workflow's own: its Dockerfile, scripts, tests and Trivy exceptions
  # are the ones used, so an old commit is tested the way it was released.
  release:
    needs:
      - guard
      - plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Created on first run with no protection rules, which changes nothing by itself. Add a
    # deployment branch rule limiting it to main, and required reviewers if a release should need a
    # second pair of eyes. The later jobs only run after this one.
    environment: release
    permissions:
      contents: write # push the tag
      packages: write # copy the images to GHCR
      attestations: read # verify a published image before reusing it
    outputs:
      tag_exists: ${{ steps.tag.outputs.exists }}
      variants: ${{ steps.publishable.outputs.variants }}
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      BASE_REF: ${{ needs.plan.outputs.base_ref }}
      BASE_DIGEST: ${{ needs.plan.outputs.base_digest }}
      DRY_RUN: ${{ inputs.dry_run == true }}

    steps:
      - name: Checkout the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      # Everything stamped into the images comes from the commit, never from the clock or the
      # clone. The release's own scripts come from the workflow's commit, not from the one built,
      # which may predate them.
      - name: Check the commit and its base
        id: commit
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/scripts/scan-findings.sh" > "$RUNNER_TEMP/scan-findings.sh"
          chmod +x "$RUNNER_TEMP/scan-findings.sh"
          # Per variant, tab-separated: UID, GID, build or reuse, index digest, platform digest.
          echo "VARIANTS_FILE=$RUNNER_TEMP/variants.tsv" >> "$GITHUB_ENV"
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "The checkout is $(git rev-parse HEAD), not the planned $SHA." >&2
            exit 1
          fi
          # The build context below replaces the runtime stage's FROM by name: a name that matched
          # no FROM would leave the floating tag in place, unpinned.
          if ! grep -qxF "FROM $BASE_REF AS runtime" deployments/docker/Dockerfile; then
            echo "deployments/docker/Dockerfile at $SHA has no 'FROM $BASE_REF AS runtime'." >&2
            exit 1
          fi
          {
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

      # A tag that already exists is a recovery: it must point at this commit, and the run
      # continues without pushing it again. A tag that appeared since the plan, or one that points
      # elsewhere, stops the run: nothing here may overwrite one.
      - name: Check the tag
        id: tag
        run: |
          set -euo pipefail
          PEELED=$(git ls-remote origin "refs/tags/$VERSION^{}" | awk '{print $1}')
          REMOTE=$(git ls-remote origin "refs/tags/$VERSION" | awk '{print $1}')
          POINTS_AT="${PEELED:-$REMOTE}"

          if [ -n "$POINTS_AT" ]; then
            if [ "$POINTS_AT" != "$SHA" ]; then
              echo "$VERSION already exists and points at $POINTS_AT, not at $SHA. Tags here are immutable: release a new version instead." >&2
              exit 1
            fi
            if [ "$MODE" != "recover" ]; then
              echo "$VERSION was tagged after the plan was made. Nothing was pushed; the next run finishes it." >&2
              exit 1
            fi
            echo "$VERSION already exists on this commit: finishing its publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MODE" = "recover" ]; then
            echo "$VERSION is not tagged on the remote, but the plan was to finish it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "swarm-rootless-docker $VERSION"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per variant, from the Git tag (the step above) and the image :<version>-uid<UID> on GHCR.
      # Only "not found" counts as absent: an authentication or network error stops the run.
      #
      #   Git tag         variant image                                    action
      #   absent          absent                                           build
      #   absent          present                                          stop before tagging
      #   on this commit  absent                                           build
      #   on this commit  present, attested by this workflow, this commit  reuse
      #   on this commit  present, anything else                           stop: needs a human
      #
      # A dry run rehearses a fresh release whatever the state: it builds every variant, and stops
      # at the absence check if an image exists.
      - name: Decide what to build
        id: decide
        env:
          TAG_EXISTS: ${{ steps.tag.outputs.exists }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$VARIANTS_FILE"
          BUILD=false
          for variant in $IMAGE_VARIANTS; do
            uid="${variant%%:*}"
            gid="${variant#*:}"
            ref="$IMAGE_REPO:$VERSION-uid$uid"
            if OUT=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>&1); then
              digest=$(jq -r '.digest' <<<"$OUT")
            elif grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
              digest=""
            else
              echo "Could not tell whether $ref exists: $OUT" >&2
              exit 1
            fi

            if [ -z "$digest" ] || [ "$DRY_RUN" = "true" ]; then
              action=build
              BUILD=true
            elif [ "$TAG_EXISTS" != "true" ]; then
              echo "$ref already exists ($digest), but the tag $VERSION does not. The version is held by an image, so it cannot be tagged: nothing was pushed. Release a higher version." >&2
              exit 1
            else
              # Verified by digest, not by tag, so what is checked is what is reused.
              if ! gh attestation verify "oci://$IMAGE_REPO@$digest" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$SIGNER_WORKFLOW" \
                --source-ref refs/heads/main > /dev/null; then
                echo "$ref ($digest) carries no provenance from $SIGNER_WORKFLOW. A tag this workflow did not produce is holding the version. Nothing was published: it needs a human." >&2
                exit 1
              fi
              # The commit and the base it records must be this release's: the plan takes a
              # recovery's base from its published images, so a variant built now matches them.
              BUILT=$(docker buildx imagetools inspect "$IMAGE_REPO@$digest" --format '{{json .Image}}' \
                | jq -r '(if has("config") then . else .[] end) | .config.Labels
                    | "\(.["org.opencontainers.image.revision"]) \(.["org.opencontainers.image.base.digest"])"' \
                | sort -u)
              if [ "$BUILT" != "$SHA $BASE_DIGEST" ]; then
                echo "$ref ($digest) is built from and on '$BUILT', not '$SHA $BASE_DIGEST'. Nothing was published: it needs a human." >&2
                exit 1
              fi
              action=reuse
            fi
            echo "$ref: ${digest:-absent}, $action"
            printf '%s\t%s\t%s\t%s\t%s\n' "$uid" "$gid" "$action" "$digest" "" >> "$VARIANTS_FILE"
          done
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # The build stage pulls dhi.io/rust.
      - name: Log in to Docker Hardened Images (dhi.io)
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      # Host network, so the builder reaches the job-local registry on localhost.
      - name: Set up Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Start the job-local registries
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker run -d --name local-registry -p 5000:5000 "$REGISTRY_IMAGE"
          PORTS=(5000)
          if [ "$DRY_RUN" = "true" ]; then
            docker run -d --name copy-registry -p 5001:5000 "$REGISTRY_IMAGE"
            PORTS+=(5001)
          fi
          for port in "${PORTS[@]}"; do
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:$port/v2/"; then
                continue 2
              fi
              sleep 1
            done
            echo "The job-local registry on port $port did not come up." >&2
            exit 1
          done

      # The only image builds, one per variant, from exactly the base digest the plan resolved: the
      # build context replaces the runtime stage's FROM. Pushed by digest with no tag, with the SBOM
      # and mode=max provenance in the index. Every layer is recompressed as gzip: for a zstd layer
      # skopeo rewrites the index entries with a compression annotation, which --preserve-digests
      # then refuses, so the copy below could not keep the tested digest. No build cache: nothing
      # another run wrote goes into a release.
      - name: Build the images into the job-local registry
        if: steps.decide.outputs.build == 'true'
        env:
          BUILD_DATE: ${{ steps.commit.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          NEXT="$VARIANTS_FILE.next"
          : > "$NEXT"
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" = "build" ]; then
              META="$RUNNER_TEMP/build-$uid.json"
              docker buildx build < /dev/null \
                --file deployments/docker/Dockerfile \
                --platform "$PLATFORMS" \
                --build-context "$BASE_REF=docker-image://docker.io/library/$BASE_REF@$BASE_DIGEST" \
                --build-arg "VERSION=$VERSION" \
                --build-arg "COMMIT=$SHA" \
                --build-arg "DATE=$BUILD_DATE" \
                --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
                --build-arg "ROOTLESS_UID=$uid" \
                --build-arg "ROOTLESS_GID=$gid" \
                --build-arg "BASE_DIGEST=$BASE_DIGEST" \
                --provenance mode=max \
                --sbom true \
                --output "type=image,name=$LOCAL_IMAGE,push-by-digest=true,name-canonical=true,push=true,compression=gzip,force-compression=true" \
                --metadata-file "$META" \
                .
              digest=$(jq -r '."containerimage.digest"' "$META")
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "The build of uid $uid reported no index digest: $(cat "$META")" >&2
                exit 1
              fi
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$uid" "$gid" "$action" "$digest" "$platform" >> "$NEXT"
          done 3< "$VARIANTS_FILE"
          mv "$NEXT" "$VARIANTS_FILE"

      # The platform image of each index, by its own digest: what is tested and scanned below is
      # exactly what is copied to GHCR. It must carry this release's labels, and its layers must
      # start with the pinned base's own: the proof that the build context replaced the FROM.
      - name: Check the built images
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          BASE=$(docker buildx imagetools inspect "docker.io/library/docker@$BASE_DIGEST" --format '{{json .Image}}' \
            | jq -c --arg platform "$PLATFORMS" 'if has("rootfs") then . else .[$platform] end | .rootfs.diff_ids')
          if [ "$(jq 'length' <<<"$BASE")" -eq 0 ]; then
            echo "The base $BASE_DIGEST has no $PLATFORMS layers." >&2
            exit 1
          fi
          NEXT="$VARIANTS_FILE.next"
          : > "$NEXT"
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" = "build" ]; then
              INDEX=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$digest" --format '{{json .Manifest}}')
              platform=$(jq -r --arg os "${PLATFORMS%%/*}" --arg arch "${PLATFORMS#*/}" \
                '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' \
                <<<"$INDEX")
              if [ -z "$platform" ]; then
                echo "The index $digest of uid $uid has no single $PLATFORMS image." >&2
                exit 1
              fi
              CONFIG=$(docker buildx imagetools inspect "$LOCAL_IMAGE@$platform" --format '{{json .Image}}')
              PROBLEMS=$(jq -r \
                --arg version "$VERSION" --arg sha "$SHA" --arg base_digest "$BASE_DIGEST" \
                --arg base_name "docker.io/library/$BASE_REF" --arg uid "$uid" --arg gid "$gid" \
                --argjson base "$BASE" '
                  .config.Labels as $labels
                  | ( [
                        ["org.opencontainers.image.version", $version],
                        ["org.opencontainers.image.revision", $sha],
                        ["org.opencontainers.image.base.digest", $base_digest],
                        ["org.opencontainers.image.base.name", $base_name],
                        ["io.github.leinardi.swarm-rootless-docker.uid", $uid],
                        ["io.github.leinardi.swarm-rootless-docker.gid", $gid]
                      ][]
                      | select($labels[.[0]] != .[1])
                      | "label \(.[0]) is \($labels[.[0]]), want \(.[1])" ),
                    ( if .rootfs.diff_ids[0:($base | length)] == $base then empty
                      else "the layers do not start with the base \($base_digest)" end )
                ' <<<"$CONFIG")
              if [ -n "$PROBLEMS" ]; then
                echo "The image of uid $uid ($platform):" >&2
                echo "$PROBLEMS" >&2
                exit 1
              fi
              echo "uid $uid: index $digest, $PLATFORMS image $platform"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$uid" "$gid" "$action" "$digest" "$platform" >> "$NEXT"
          done 3< "$VARIANTS_FILE"
          mv "$NEXT" "$VARIANTS_FILE"

      # For the integration tests, which the commit's own Makefile runs with cargo.
      - name: Set up Rust
        if: steps.decide.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0

      # Ubuntu runners restrict unprivileged user namespaces through AppArmor, which rootlesskit
      # needs; the Swarm test deploys into this throwaway runner's own swarm. As in ci.yaml.
      - name: Prepare the runner for the integration tests
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker swarm init > /dev/null

      # ci.yaml's image checks and integration tests, against each built platform digest pulled back
      # from the job-local registry rather than a second build.
      - name: Test the built images
        if: steps.decide.outputs.build == 'true'
        env:
          SRD_IT_REQUIRE: "1"
          SRD_IT_SWARM: "1"
        run: |
          set -euo pipefail
          case " $IMAGE_VARIANTS " in
            *" $INTEGRATION_VARIANT "*) ;;
            *)
              echo "INTEGRATION_VARIANT $INTEGRATION_VARIANT is not one of IMAGE_VARIANTS ($IMAGE_VARIANTS)." >&2
              exit 1
              ;;
          esac
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" != "build" ]; then
              continue
            fi
            IMAGE="swarm-rootless-docker:release-uid$uid"
            docker pull "$LOCAL_IMAGE@$platform"
            docker tag "$LOCAL_IMAGE@$platform" "$IMAGE"
            make image-test IMAGE="$IMAGE" ROOTLESS_UID="$uid" ROOTLESS_GID="$gid" < /dev/null
            if [ "$uid:$gid" = "$INTEGRATION_VARIANT" ]; then
              make integration-test IMAGE="$IMAGE" < /dev/null
            fi
            docker image rm "$IMAGE" "$LOCAL_IMAGE@$platform" > /dev/null
          done 3< "$VARIANTS_FILE"

      - name: Install Trivy
        if: steps.decide.outputs.build == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # The gate is what the image adds to its base (.github/scripts/scan-findings.sh): a HIGH or
      # CRITICAL finding with a fix upstream fails the run here, before any tag exists, unless the
      # pinned base digest carries the same finding. Upstream's own findings (its Alpine packages,
      # the Go modules in its binaries) are reported, not gated: nothing here can fix them, and the
      # daily base rebuild ships upstream's fix as soon as upstream publishes one. Unfixed findings
      # are left out, and the only other exceptions are the commit's .trivyignore.yaml.
      - name: Scan the built images
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" = "build" ]; then
              echo "Scanning uid $uid, $PLATFORMS: $platform"
              "$RUNNER_TEMP/scan-findings.sh" "$LOCAL_IMAGE@$platform" "docker.io/library/docker@$BASE_DIGEST" < /dev/null
            fi
          done 3< "$VARIANTS_FILE"

      # The last look at the tags before the point of no return. Concurrency serializes the
      # workflow, but a tag can also arrive from outside it, and the plan ran before the builds.
      # This asks the remote, now.
      - name: Gate the tag
        if: steps.tag.outputs.exists != 'true' || env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under set -e instead of
          # reading as "no tags"; only grep finding no release tag may come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || [ $? -eq 1 ]; } \
            | sort -V \
            | tail -n1)
          if [ -z "$HIGHEST_REMOTE" ] || [ "$HIGHEST_REMOTE" = "$VERSION" ]; then
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$HIGHEST_REMOTE" | sort -V | tail -n1)
          if [ "$HIGHEST" = "$VERSION" ]; then
            exit 0
          fi
          if [ "$MODE" = "recover" ]; then
            echo "::notice::$HIGHEST_REMOTE is higher than $VERSION. Finishing the release of $VERSION, which will not take the floating tags."
            exit 0
          fi
          echo "$HIGHEST_REMOTE was published while this run was building, so $VERSION would be a lower immutable tag. Nothing was pushed." >&2
          exit 1

      # Right before the tag is pushed: no variant's version may be held by an image, or the tag
      # would point at a version this run can never publish. Same fail-closed lookup as above.
      - name: Check the version images are absent
        if: steps.tag.outputs.exists != 'true' || env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          for variant in $IMAGE_VARIANTS; do
            ref="$IMAGE_REPO:$VERSION-uid${variant%%:*}"
            if OUT=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "$ref exists. Nothing was pushed; release a higher version." >&2
              exit 1
            elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
              echo "Could not tell whether $ref exists: $OUT" >&2
              exit 1
            fi
          done

      # The copy below, against the second job-local registry instead of GHCR, with the same
      # checks: the digest survives, and so do the SBOM and provenance manifests.
      - name: Rehearse the copy on a second local registry
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          WANT=$(tr ',' '\n' <<<"$PLATFORMS" | wc -l)
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            docker run --rm --network host "$SKOPEO_IMAGE" copy --all --preserve-digests \
              --src-tls-verify=false --dest-tls-verify=false \
              "docker://$LOCAL_IMAGE@$digest" "docker://$COPY_IMAGE@$digest" < /dev/null
            RAW=$(mktemp)
            docker run --rm --network host "$SKOPEO_IMAGE" inspect --raw --tls-verify=false \
              "docker://$COPY_IMAGE@$digest" > "$RAW" < /dev/null
            COPIED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
            if [ "$COPIED" != "$digest" ]; then
              echo "The copied index of uid $uid is $COPIED, not the tested $digest." >&2
              exit 1
            fi
            ATTESTATIONS=$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' "$RAW")
            if [ "$ATTESTATIONS" -ne "$WANT" ]; then
              echo "The copied index of uid $uid carries $ATTESTATIONS attestation manifests, want $WANT (one per platform)." >&2
              exit 1
            fi
            echo "uid $uid: copied $digest with its digest and $ATTESTATIONS attestation manifests intact."
          done 3< "$VARIANTS_FILE"

      - name: Report what a real run would publish
        if: env.DRY_RUN == 'true'
        env:
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          {
            echo "# Dry run: $VERSION ($MODE)"
            echo
            echo "From \`$SHA\` on \`$BASE_REF@$BASE_DIGEST\`; previous release: ${PREVIOUS:-none}."
            echo
            echo "No tag was created and nothing was published. Each image index was built into a job-local registry, its"
            echo "$PLATFORMS image was tested and scanned, and the index was copied to a second local registry with its"
            echo "digest and attestation manifests intact:"
            echo
            while IFS=$'\t' read -r uid gid action digest platform; do
              echo "- uid $uid, gid $gid: \`$digest\` (\`$platform\`)"
            done < "$VARIANTS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      # The point of no return. Everything after it reuses a published artifact only once it is
      # proven to be this workflow's and never replaces one, so the next run finishes a failed
      # publish.
      - name: Push the tag
        if: env.DRY_RUN != 'true' && steps.tag.outputs.exists != 'true'
        run: git push origin "refs/tags/$VERSION"

      # The tested indexes, byte for byte, with no tag at all: a version tag is only ever added
      # once the digest has been attested and signed, so an untagged digest left by a failed run is
      # inert. What GHCR then serves under each digest is hashed here, not taken from a tool's
      # report.
      - name: Copy the images to GHCR by digest
        if: env.DRY_RUN != 'true' && steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r -u 3 uid gid action digest platform; do
            if [ "$action" != "build" ]; then
              continue
            fi
            docker run --rm --network host -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
              copy --all --preserve-digests --src-tls-verify=false --dest-authfile /auth.json \
              "docker://$LOCAL_IMAGE@$digest" "docker://$IMAGE_REPO@$digest" < /dev/null
            RAW=$(mktemp)
            docker run --rm -v "$HOME/.docker/config.json:/auth.json:ro" "$SKOPEO_IMAGE" \
              inspect --raw --authfile /auth.json "docker://$IMAGE_REPO@$digest" > "$RAW" < /dev/null
            SERVED="sha256:$(sha256sum < "$RAW" | cut -d' ' -f1)"
            if [ "$SERVED" != "$digest" ]; then
              echo "GHCR serves $SERVED for $IMAGE_REPO@$digest (uid $uid), not the tested index. Nothing was tagged." >&2
              exit 1
            fi
          done 3< "$VARIANTS_FILE"

      # The variants for the publish job's matrix.
      - name: List the variants to publish
        id: publishable
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          VARIANTS=$(jq -R -s -c '
            split("\n") | map(select(length > 0) | split("\t")
            | {uid: .[0], gid: .[1], action: .[2], digest: .[3]})
          ' "$VARIANTS_FILE")
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"

  # Per variant: attest and sign a new digest, or check a reused one carries this workflow's
  # signature, then add its version tag.
  publish:
    needs:
      - plan
      - release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # attestation, signature and version tag
      id-token: write # cosign keyless signing and provenance via GitHub OIDC
      attestations: write # provenance attestation upload
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.release.outputs.variants) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      UID_TAG: uid${{ matrix.variant.uid }}
      ACTION: ${{ matrix.variant.action }}
      DIGEST: ${{ matrix.variant.digest }}

    steps:
      # The workflow's own commit, for scan-findings.sh and the current Trivy exceptions.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign v3 stores the signature as a Sigstore bundle in an OCI 1.1 referring artifact;
      # a consumer needs cosign v3, or v2.6+ with --new-bundle-format, to verify.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest image provenance
        if: matrix.variant.action == 'build'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ matrix.variant.digest }}
          push-to-registry: true

      # A new digest is signed. A reused one must already carry this workflow's own keyless
      # signature, since the version tag is only ever added after signing; any other signature,
      # from another workflow or a laptop, does not count.
      - name: Sign the image with cosign (keyless via GitHub OIDC)
        run: |
          set -euo pipefail
          if [ "$ACTION" = "reuse" ]; then
            if ! cosign verify \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$IMAGE_REPO@$DIGEST" > /dev/null; then
              echo "$IMAGE_REPO@$DIGEST is attested by this workflow but carries no signature from it. Nothing more was published: it needs a human." >&2
              exit 1
            fi
            echo "$IMAGE_REPO@$DIGEST carries this workflow's signature: reusing it."
          else
            cosign sign --yes "$IMAGE_REPO@$DIGEST"
          fi

      - name: Install Trivy
        if: matrix.variant.action == 'reuse'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # The reused image is already published and immutable, so its scan cannot stop anything: a
      # finding it adds to its base is reported as a warning, for a human to judge whether to
      # release sooner.
      - name: Scan the reused image
        if: matrix.variant.action == 'reuse'
        run: |
          set -euo pipefail
          BASE=$(docker buildx imagetools inspect "$IMAGE_REPO@$DIGEST" --format '{{json .Image}}' \
            | jq -r '(if has("config") then . else .[] end) | .config.Labels["org.opencontainers.image.base.digest"]' \
            | sort -u)
          if ! .github/scripts/scan-findings.sh "$IMAGE_REPO@$DIGEST" "docker.io/library/docker@$BASE"; then
            echo "::warning::The reused $IMAGE_REPO@$DIGEST adds fixable HIGH or CRITICAL findings to its base, or could not be scanned. It is already published and was not changed."
          fi

      - name: Tag the image with the version
        if: matrix.variant.action == 'build'
        run: |
          set -euo pipefail
          ref="$IMAGE_REPO:$VERSION-$UID_TAG"
          # Checked again right before tagging: a version tag that appeared since the checks above
          # is never overwritten.
          if OUT=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "$ref appeared while this run was publishing. It was not overwritten: the next run verifies it, or it needs a human." >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$OUT"; then
            echo "Could not tell whether $ref exists: $OUT" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$ref" "$IMAGE_REPO@$DIGEST"

  # The GitHub release and the floating tags, once every variant carries its version tag.
  finalize:
    needs:
      - plan
      - release
      - publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the release
      packages: write # move the floating tags
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      MAJOR: ${{ needs.plan.outputs.major }}
      BASE_REF: ${{ needs.plan.outputs.base_ref }}
      BASE_DIGEST: ${{ needs.plan.outputs.base_digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # The workflow's own commit, for release-plan.sh, with every tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digests the release job tested (or verified, for a reused image) and the publish job
      # attested and signed are the ones the floating tags move to. Each version tag must still
      # resolve to its digest: one that changed since was not published by this run, and nothing is
      # promoted from it.
      - name: Check the published images
        id: images
        env:
          VARIANTS: ${{ needs.release.outputs.variants }}
        run: |
          set -euo pipefail
          DIGESTS=""
          while read -r uid digest; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "The release job reported no digest for uid $uid (got '$digest')." >&2
              exit 1
            fi
            ref="$IMAGE_REPO:$VERSION-uid$uid"
            TAGGED=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ "$TAGGED" != "$digest" ]; then
              echo "$ref resolves to $TAGGED, not to the published $digest. Nothing was promoted: it needs a human." >&2
              exit 1
            fi
            DIGESTS+="$uid=$digest "
          done < <(jq -r '.[] | "\(.uid) \(.digest)"' <<<"$VARIANTS")
          WANT=$(wc -w <<<"$IMAGE_VARIANTS")
          if [ "$(wc -w <<<"$DIGESTS")" -ne "$WANT" ]; then
            echo "The release job reported '$DIGESTS', want one digest for each of the $WANT variants." >&2
            exit 1
          fi
          echo "digests=$DIGESTS" >> "$GITHUB_OUTPUT"

      # The release carries no assets: the images are the artifact. It is created as a draft if it
      # does not exist yet, and stays one until the floating tags have moved. An asset on it means
      # something outside this workflow touched it: that needs a human.
      - name: Draft the GitHub release
        env:
          DIGESTS: ${{ steps.images.outputs.digests }}
        run: |
          set -euo pipefail
          if ! OUT=$(gh release view "$VERSION" --json isDraft 2>&1); then
            if ! grep -qi 'release not found' <<<"$OUT"; then
              echo "Could not tell whether the release $VERSION exists: $OUT" >&2
              exit 1
            fi
            NOTES=$(mktemp)
            {
              if [ "$MODE" = "base" ]; then
                echo "A rebuild of $PREVIOUS's commit on a new digest of its base: no code change."
                echo
              fi
              echo "Built on \`$BASE_REF@$BASE_DIGEST\`. Images:"
              echo
              for entry in $DIGESTS; do
                echo "- \`$IMAGE_REPO:$VERSION-uid${entry%%=*}\` (\`${entry#*=}\`)"
              done
            } > "$NOTES"
            gh release create "$VERSION" --verify-tag --draft --generate-notes --notes-file "$NOTES" --title "$VERSION"
          fi
          # Read into a variable first, so a failed lookup stops the step instead of reading as
          # "no assets".
          NAMES=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          if [ -n "$NAMES" ]; then
            echo "The release $VERSION carries assets this workflow never uploads: $NAMES. Nothing was changed; it needs a human." >&2
            exit 1
          fi

      # The floating <docker-major>-uid<UID> tags go last, after a fresh look at the remote tags: a
      # version that is no longer the highest of its Docker major does not take them. Best-effort,
      # not atomic: a release of the same major tagged outside this workflow in between can leave
      # them behind, and re-running that release's own run repoints them.
      - name: Move the floating tags
        id: floating
        env:
          DIGESTS: ${{ steps.images.outputs.digests }}
        run: |
          set -euo pipefail
          git fetch --quiet origin 'refs/tags/*:refs/tags/*'
          FLOATING=$(.github/scripts/release-plan.sh floating "$VERSION")
          if [ "$FLOATING" != "true" ]; then
            echo "::notice::A higher release of Docker $MAJOR exists, so the $MAJOR-uid<UID> tags were left where they are."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for entry in $DIGESTS; do
            docker buildx imagetools create -t "$IMAGE_REPO:$MAJOR-uid${entry%%=*}" "$IMAGE_REPO@${entry#*=}"
          done
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        id: publish
        run: |
          set -euo pipefail
          # Its own assignment, so a failed ls-remote stops the step under set -e instead of
          # reading as "no tags"; only grep finding no release tag may come back empty.
          REMOTE_TAGS=$(git ls-remote --tags --refs origin)
          HIGHEST_REMOTE=$(awk -F/ '{print $NF}' <<<"$REMOTE_TAGS" \
            | { grep -E "$RELEASE_TAG_REGEX" || [ $? -eq 1 ]; } \
            | sort -V \
            | tail -n1)
          LATEST=false
          if [ "$HIGHEST_REMOTE" = "$VERSION" ]; then
            LATEST=true
          fi
          gh release edit "$VERSION" --draft=false --latest="$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Summarize the release
        env:
          DIGESTS: ${{ steps.images.outputs.digests }}
          MOVED: ${{ steps.floating.outputs.moved }}
          LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          set -euo pipefail
          {
            echo "# Released $VERSION ($MODE)"
            echo
            echo "From \`$SHA\` on \`$BASE_REF@$BASE_DIGEST\`; previous release: ${PREVIOUS:-none}."
            echo
            echo "- [Release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION) - marked latest: $LATEST"
            for entry in $DIGESTS; do
              echo "- \`$IMAGE_REPO:$VERSION-uid${entry%%=*}\` (\`${entry#*=}\`) - \`$MAJOR-uid${entry%%=*}\` moved: $MOVED"
            done
          } >> "$GITHUB_STEP_SUMMARY"
