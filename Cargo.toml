[workspace]
members = [".", "meta"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/swarm-rootless-docker"

# The crates shared with the other Rust services, from leinardi/rust-common: a git dependency
# pinned by `rev` while the adoption is reviewed, then by release tag. `version` keeps cargo-deny's
# `wildcards = "deny"` satisfied and makes cargo refuse a checkout of another version. Each member
# opts in with `<name>.workspace = true` and its own features. Local work on both repositories: an
# uncommitted `[patch."https://github.com/leinardi/rust-common"]` table naming each crate with
# `path = "../rust-common/crates/<name>"`, never in a release or image build (the image's build
# context does not hold them).
[workspace.dependencies]
repo-meta = { git = "https://github.com/leinardi/rust-common", rev = "f1c8ef2336cbe57119f058d11fcf4d34f0f3b52d", version = "0.1" }
service-kit = { git = "https://github.com/leinardi/rust-common", rev = "f1c8ef2336cbe57119f058d11fcf4d34f0f3b52d", version = "0.1" }
testenv-core = { git = "https://github.com/leinardi/rust-common", rev = "f1c8ef2336cbe57119f058d11fcf4d34f0f3b52d", version = "0.1" }
tracing-setup = { git = "https://github.com/leinardi/rust-common", rev = "f1c8ef2336cbe57119f058d11fcf4d34f0f3b52d", version = "0.1" }

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and the meta crate asserts that each one does), and every clippy run is
# workspace-wide.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory. Every one is counted by scripts/check-suppressions.sh.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# Output goes through the logger, or an explicit writeln! to a handle.
print_stdout = "deny"
print_stderr = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names, no single-letter identifiers.
min_ident_chars = "deny"

[package]
name = "swarm-rootless-docker"
version = "0.0.0"
description = "Launcher and image for a dedicated rootless Docker daemon per Docker Swarm service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "string"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros", "net", "io-util", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }

[dev-dependencies]
base64 = "0.23.1"
tokio = { version = "1.54.1", default-features = false, features = ["test-util", "net", "io-util", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The meta-tests scan the tree with regexes; unoptimised, regex compilation and matching dominate
# their run time. Only the regex crates are optimised in dev and test builds, which costs a few
# seconds on a clean build and nothing on an incremental one; the workspace's own code stays at
# opt-level 0 for debugging.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
