[package]
name = "meta"
version = "0.0.0"
description = "Repository meta-tests for swarm-rootless-docker"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The repository checks the meta-tests run (repo-meta, rust-common), and the repository root the
# library defines (testenv-core's repo_root!, default features, rust-common).
[dependencies]
repo-meta.workspace = true
testenv-core.workspace = true

# This repository's own rules: the source patterns (regex) and the workspace manifests of the lint
# opt-in's negative controls (toml).
[dev-dependencies]
regex = "1.13.1"
toml = "1.1.8"
